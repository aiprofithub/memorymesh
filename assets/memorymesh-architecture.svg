    <text x="32" y="48" fill="#F0FFF6" font-family="Inter, ui-sans-serif, system-ui" font-size="26" font-weight="800">MemoryMesh</text>
    <text x="32" y="82" fill="#A7F3D0" font-family="Inter, ui-sans-serif, system-ui" font-size="15">Memory control plane</text>
    <rect x="32" y="116" width="256" height="42" rx="14" fill="#06120D" stroke="#A7F3D0" stroke-opacity="0.12"/>
    <text x="52" y="143" fill="#CFFBE2" font-family="Inter, ui-sans-serif, system-ui" font-size="16">Remember</text>
