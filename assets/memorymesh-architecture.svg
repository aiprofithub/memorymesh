    <text x="52" y="197" fill="#CFFBE2" font-family="Inter, ui-sans-serif, system-ui" font-size="16">Search / Recall</text>
    <rect x="32" y="224" width="256" height="42" rx="14" fill="#06120D" stroke="#A7F3D0" stroke-opacity="0.12"/>
    <text x="52" y="251" fill="#CFFBE2" font-family="Inter, ui-sans-serif, system-ui" font-size="16">Forget / Retain / Audit</text>
  </g>

  <path d="M760 319H878" stroke="#34D399" stroke-width="3" marker-end="url(#arrow)"/>

