<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MemoryMesh architecture diagram">
  <rect width="1200" height="520" rx="28" fill="#07130E"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#34D399" opacity="0.8"/>
    </marker>
  </defs>
  <text x="64" y="78" fill="#F0FFF6" font-family="Inter, ui-sans-serif, system-ui" font-size="36" font-weight="800">One memory layer for every AI workflow</text>
  <text x="64" y="116" fill="#A7F3D0" font-family="Inter, ui-sans-serif, system-ui" font-size="18">Apps, agents, copilots, and MCP clients write to a shared memory control plane.</text>

  <g transform="translate(64 180)">
    <rect width="210" height="70" rx="20" fill="#0B1F16" stroke="#A7F3D0" stroke-opacity="0.2"/>
    <text x="28" y="43" fill="#F0FFF6" font-family="Inter, ui-sans-serif, system-ui" font-size="20" font-weight="700">AI SaaS App</text>
  </g>
  <g transform="translate(64 284)">
    <rect width="210" height="70" rx="20" fill="#0B1F16" stroke="#A7F3D0" stroke-opacity="0.2"/>
    <text x="28" y="43" fill="#F0FFF6" font-family="Inter, ui-sans-serif, system-ui" font-size="20" font-weight="700">Agent Runtime</text>
  </g>
  <g transform="translate(64 388)">
    <rect width="210" height="70" rx="20" fill="#0B1F16" stroke="#A7F3D0" stroke-opacity="0.2"/>
    <text x="28" y="43" fill="#F0FFF6" font-family="Inter, ui-sans-serif, system-ui" font-size="20" font-weight="700">MCP Client</text>
  </g>

  <path d="M292 215H410" stroke="#34D399" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M292 319H410" stroke="#34D399" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M292 423H410" stroke="#34D399" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(420 174)">
